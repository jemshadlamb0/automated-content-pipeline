[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-content-pipeline"
version = "0.1.1"
description = "Configurable multilingual pipeline with optional Hugging Face local inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.9,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]
huggingface = [
  "torch>=2.5",
  "transformers>=4.48",
  "huggingface_hub>=0.27",
  "safetensors>=0.4",
  "accelerate>=0.26",
]

[project.scripts]
acp = "acp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.bandit]
exclude_dirs = ["tests"]
