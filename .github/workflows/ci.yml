name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-static-analysis:
    name: test-and-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff checks
        run: ruff check --select E4,E7,E9,F src tests scripts
      - name: Bandit static security checks
        run: bandit -q -r src scripts -ll
      - name: Audit base runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Scan tracked files for common secrets
        run: python scripts/check_secrets.py
      - name: Run tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Validate default configuration
        run: python -m acp.main --check-config
