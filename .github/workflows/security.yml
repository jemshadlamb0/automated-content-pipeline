name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-checks:
    name: dependency-and-static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -q -r src scripts -ll
      - name: Secret pattern scan
        run: python scripts/check_secrets.py
      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests scripts
      - name: Tests
        run: pytest
