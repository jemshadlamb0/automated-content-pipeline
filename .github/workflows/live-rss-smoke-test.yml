name: Live RSS ingestion smoke test

on:
  push:
    branches: [main]
    paths:
      - "config/settings.yaml"
      - ".github/workflows/live-rss-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-rss-ingestion-smoke-test
  cancel-in-progress: false

jobs:
  live-feed-discovery:
    name: Fetch and parse configured news feeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Validate configuration
        run: python -m acp.main --check-config

      - name: Fetch live RSS and validate the result
        id: discovery
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from acp.config import load_settings
          from acp.security.url_policy import UnsafeURLError
          from acp.sources.article import ArticleExtractionError, extract_article
          from acp.sources.http_fetcher import HTTPFetchError, SafeHTTPFetcher

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def write_summary(text):
              with summary_path.open("a", encoding="utf-8") as handle:
                  handle.write(text.rstrip() + "\n")

          try:
              result = subprocess.run(
                  [sys.executable, "-m", "acp.main", "--discover-feeds"],
                  capture_output=True,
                  text=True,
                  timeout=90,
                  check=False,
              )
          except subprocess.TimeoutExpired:
              write_summary("## Live RSS ingestion smoke test\n\n**Result: FAILED** — discovery exceeded the 90-second timeout.")
              raise SystemExit(1)

          if result.stdout:
              print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")

          try:
              payload = json.loads(result.stdout)
          except json.JSONDecodeError:
              write_summary(
                  "## Live RSS ingestion smoke test\n\n"
                  "**Result: FAILED** — the discovery command did not return valid JSON."
              )
              raise SystemExit(result.returncode or 1)

          # Fetch a real article from the trusted feed and extract bounded source text.
          settings = load_settings("config/settings.yaml")
          sources = settings["sources"]
          fetcher = SafeHTTPFetcher(
              timeout_seconds=float(sources["timeout_seconds"]),
              max_response_bytes=sources["max_response_bytes"],
              max_redirects=sources["max_redirects"],
              max_retries=sources["max_retries"],
              allow_http=False,
          )
          article_result = {"status": "failed", "attempts": 0, "body_characters": 0, "publishing_performed": False}
          article_errors = []
          for candidate in payload.get("candidates", [])[:3]:
              feed_config = next(
                  (feed for feed in sources["feeds"] if feed.get("name") == candidate.get("feed_name")),
                  None,
              )
              if feed_config is None:
                  article_errors.append({"title": str(candidate.get("title", ""))[:160], "reason": "No configured source allowlist matched this candidate"})
                  continue
              article_result["attempts"] += 1
              try:
                  response = fetcher.fetch(
                      candidate["url"],
                      allowed_hosts=feed_config.get("allowed_hosts") or None,
                      allowed_content_types={"text/html", "application/xhtml+xml"},
                  )
                  evidence = extract_article(
                      response.text(),
                      response.url,
                      source_name=candidate.get("feed_name", "Unknown publisher"),
                      fallback_title=candidate.get("title", ""),
                      content_type=response.content_type,
                  )
                  body_characters = len(evidence.body_text.strip())
                  if body_characters < 80:
                      raise ArticleExtractionError("Extracted body text was shorter than 80 characters")
                  article_result = {
                      "status": "extracted",
                      "attempts": article_result["attempts"],
                      "title": evidence.title[:300],
                      "source_url": evidence.source_url,
                      "published_at": evidence.published_at,
                      "content_type": evidence.content_type,
                      "body_characters": body_characters,
                      "description_present": bool(evidence.description),
                      "publishing_performed": False,
                  }
                  break
              except (HTTPFetchError, UnsafeURLError, ArticleExtractionError, ValueError, OSError) as exc:
                  article_errors.append({
                      "title": str(candidate.get("title") or "(untitled)")[:160],
                      "reason": re.sub(r"[\r\n\t]", " ", f"{type(exc).__name__}: {exc}")[:300],
                  })
          article_result["errors"] = article_errors

          # OpenAI RSS is readable from the runner, but article pages may block cloud-runner traffic.
          # Do not spoof a browser or bypass that restriction. Validate the extractor separately
          # against a known public GitHub Blog article if all configured-feed pages are blocked.
          article_fallback = {"status": "not_needed", "attempts": 0, "body_characters": 0, "publishing_performed": False}
          if article_result.get("status") != "extracted":
              article_fallback["status"] = "failed"
              article_fallback["attempts"] = 1
              try:
                  fallback_url = "https://github.blog/ai-and-ml/github-copilot/how-the-github-legal-team-used-copilot-cli-to-streamline-their-workflows/"
                  fallback_response = fetcher.fetch(
                      fallback_url,
                      allowed_hosts=["github.blog"],
                      allowed_content_types={"text/html", "application/xhtml+xml"},
                  )
                  fallback_evidence = extract_article(
                      fallback_response.text(),
                      fallback_response.url,
                      source_name="GitHub Blog (extractor validation only)",
                      fallback_title="How the GitHub legal team used Copilot CLI to streamline their workflows",
                      content_type=fallback_response.content_type,
                  )
                  fallback_body_characters = len(fallback_evidence.body_text.strip())
                  if fallback_body_characters < 80:
                      raise ArticleExtractionError("Reference page body text was shorter than 80 characters")
                  article_fallback = {
                      "status": "extracted",
                      "attempts": 1,
                      "title": fallback_evidence.title[:300],
                      "source_url": fallback_evidence.source_url,
                      "published_at": fallback_evidence.published_at,
                      "content_type": fallback_evidence.content_type,
                      "body_characters": fallback_body_characters,
                      "description_present": bool(fallback_evidence.description),
                      "publishing_performed": False,
                  }
              except (HTTPFetchError, UnsafeURLError, ArticleExtractionError, ValueError, OSError) as exc:
                  article_fallback["errors"] = [re.sub(r"[\r\n\t]", " ", f"{type(exc).__name__}: {exc}")[:300]]
          article_extraction = {
              "configured_feed_candidate": article_result,
              "reference_page_fallback": article_fallback,
          }
          payload["article_extraction"] = article_extraction
          Path("feed-discovery.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"article_extraction": article_extraction}, ensure_ascii=False, indent=2))

          configured = payload.get("feeds_configured", 0)
          checked = payload.get("feeds_checked", 0)
          candidates = payload.get("candidates", [])
          candidate_count = payload.get("candidate_count", len(candidates))
          failures = payload.get("failures", [])
          publishing = payload.get("publishing_performed")

          checks = [
              ("Exactly one feed configured", configured == 1),
              ("One feed fetched successfully", checked == 1),
              ("At least one article candidate parsed", candidate_count > 0),
              ("No feed failures", len(failures) == 0),
              ("A real article page fetched and yielded extracted text", (article_result.get("status") == "extracted" and article_result.get("body_characters", 0) >= 80) or (article_fallback.get("status") == "extracted" and article_fallback.get("body_characters", 0) >= 80)),
              ("No publishing performed", publishing is False and article_result.get("publishing_performed") is False and article_fallback.get("publishing_performed") is False),
              ("CLI exit code is zero", result.returncode == 0),
          ]
          passed = all(ok for _, ok in checks)

          lines = [
              "## Live RSS ingestion smoke test",
              "",
              f"**Result: {'PASSED' if passed else 'FAILED'}**",
              "",
              f"- Feeds configured: {configured}",
              f"- Feeds checked successfully: {checked}",
              f"- Article candidates parsed: {candidate_count}",
              f"- Feed failures: {len(failures)}",
              f"- Configured-feed article extraction: {article_result.get('status')}",
              f"- Configured-feed article body characters: {article_result.get('body_characters', 0)}",
              f"- Configured-feed article attempts: {article_result.get('attempts', 0)}",
              f"- Reference-page extraction: {article_fallback.get('status')}",
              f"- Reference-page body characters: {article_fallback.get('body_characters', 0)}",
              f"- Publishing performed: {publishing}",
              "",
              "### Checks",
          ]
          lines.extend(f"- [{'x' if ok else ' '}] {name}" for name, ok in checks)

          if candidates:
              lines.extend(["", "### Candidate headlines (up to 10)"])
              for candidate in candidates[:10]:
                  title = str(candidate.get("title") or "(untitled)")
                  title = re.sub(r"[\r\n\t|]", " ", title)
                  title = title.replace(chr(96), "")
                  title = re.sub(r"([*_{}\[\]()#+.!>])", r"\\\1", title)[:180]
                  published = str(candidate.get("published_at") or "date not supplied")
                  published = re.sub(r"[\r\n\t]", " ", published)[:80]
                  lines.append(f"- {title} — {published}")

          if failures:
              lines.extend(["", "### Feed errors"])
              for failure in failures:
                  name = re.sub(r"[\r\n\t]", " ", str(failure.get("feed_name") or "Unknown feed"))[:100]
                  reason = re.sub(r"[\r\n\t]", " ", str(failure.get("reason") or "Unknown error"))[:300]
                  lines.append(f"- **{name}:** {reason}")

          if article_errors:
              lines.extend(["", "### Configured-feed article extraction attempts"])
              for failure in article_errors:
                  title = re.sub(r"[\r\n\t|]", " ", str(failure.get("title") or "(untitled)"))[:160]
                  reason = re.sub(r"[\r\n\t|]", " ", str(failure.get("reason") or "Unknown error"))[:300]
                  lines.append(f"- **{title}:** {reason}")

          if article_fallback.get("errors"):
              lines.extend(["", "### Reference-page extraction error"])
              lines.append("- " + str(article_fallback["errors"][0])[:300])

          if article_result.get("status") != "extracted" and article_fallback.get("status") == "extracted":
              lines.extend(["", "Note: OpenAI feed article pages were not extractable from this runner; the separate reference article validated HTML extraction. See configured-feed attempts above."])

          lines.extend([
              "",
              "Full JSON output is available in the Fetch live RSS and validate the result step log.",
              "The workflow uses read-only repository permissions and does not generate or publish posts.",
          ])
          write_summary("\n".join(lines))

          if not passed:
              raise SystemExit(1)
          PY
